.logo{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:700;letter-spacing:-.03em;line-height:1;color:#111111;display:inline-block;white-space:nowrap;text-decoration:none}.logo span{color:transparent;-webkit-text-stroke:1.2px #111111;font-weight:400}
/* Layout: Arbeitsfläche wie ein Stadtplan – feste Navigation links (Desktop) bzw. unten (Handy), Inhalte als Raster aus weissen Flächen mit schwarzen Linien. Nur Schwarz/Weiss, kein dunkler Hintergrund. */
:root{
  --bg:#F6F6F4; --surface:#FFFFFF; --ink:#111111; --ink-2:#55554F; --ink-3:#8A8A84;
  --line:#E2E2DD; --line-strong:#111111; --muted:#EFEFEC;
  --display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --body:'Inter','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:6px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:800}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:.01em}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* Prototyp-Leiste */
.proto{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--ink);color:#FFFFFF;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-family:var(--mono);font-size:11.5px}
.proto select{background:#FFFFFF;color:#111111;border:0;border-radius:4px;padding:2px 6px;font-size:11.5px}
.proto button{background:transparent;color:#FFFFFF;border:1px solid #FFFFFF;border-radius:4px;padding:2px 8px;font-size:11.5px;cursor:pointer}

/* Shell */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100% - 30px)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:30px;height:calc(100vh - 30px);overflow:auto}
.brand{display:flex;flex-direction:column;gap:6px;padding:0 8px}
.brand img{width:118px;height:auto}
.brand .city{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);text-decoration:none;color:var(--ink-2);font-weight:500}
.nav a:hover{background:var(--muted);color:var(--ink)}
.nav a.on{background:var(--ink);color:#FFFFFF}
.nav a .cnt{margin-left:auto;font-family:var(--mono);font-size:11px}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.main{min-width:0;padding-block:24px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head .t{display:flex;flex-direction:column;gap:4px}

/* Bausteine */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.dash{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);background:var(--ink);color:#FFFFFF;border-radius:var(--r);padding:8px 14px;font-weight:600;cursor:pointer;text-decoration:none;font-size:14px;min-height:38px}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn.link{border-color:transparent;background:transparent;color:var(--ink);padding:4px 6px;min-height:0;text-decoration:underline;text-underline-offset:3px;font-weight:500}
.btn:disabled{opacity:.4;cursor:default}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-weight:500;font-size:13.5px}
.seg button.on{background:var(--ink);color:#FFFFFF}
.badge{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--ink);border-radius:3px;padding:1px 6px;white-space:nowrap}
.badge.solid{background:var(--ink);color:#FFFFFF}
.badge.soft{border-color:var(--line);color:var(--ink-2)}
.av{width:36px;height:36px;border-radius:50%;border:1px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px;flex:none;background:var(--surface)}
.av.sm{width:28px;height:28px;font-size:11px}
.who{display:flex;gap:10px;align-items:center;min-width:0}
.who .n{font-weight:600}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600}
.in{width:100%;border:1px solid #C9C9C3;background:var(--surface);border-radius:var(--r);padding:9px 11px;min-height:40px}
.in:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:var(--ink)}
textarea.in{min-height:90px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form .full{grid-column:1/-1}
.hr{height:1px;background:var(--line);border:0;margin:0}
.list>*+*{border-top:1px solid var(--line)}
.item{padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.item .body{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.clickable{cursor:pointer}
.clickable:hover{background:#FAFAF8}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-weight:500}
.stat{display:flex;flex-direction:column;gap:2px;padding:14px 16px}
.stat b{font-family:var(--display);font-size:26px;font-weight:800}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--ink);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 12px;cursor:pointer;font-weight:500;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.thumb{aspect-ratio:16/9;max-width:100%;border-radius:4px;border:1px solid var(--line);background:repeating-linear-gradient(135deg,var(--muted) 0 10px,var(--surface) 10px 20px);display:grid;place-items:center;color:var(--ink-3);font-family:var(--mono);font-size:11px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;background:var(--surface);cursor:pointer}
.chip.on{border-color:var(--ink);background:var(--ink);color:#FFFFFF}
.new{width:7px;height:7px;border-radius:50%;background:var(--ink);display:inline-block}

/* Feed */
.composer textarea{border:0;min-height:56px;padding:0;resize:vertical;width:100%;outline:none}
.ctypes{display:flex;gap:6px;flex-wrap:wrap}
.feed-item{padding:16px;display:flex;flex-direction:column;gap:10px}
.feed-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.poll{display:flex;flex-direction:column;gap:8px}
.popt{position:relative;border:1px solid var(--ink);border-radius:var(--r);padding:9px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;overflow:hidden;background:var(--surface);text-align:left;width:100%}
.popt .bar{position:absolute;inset:0 auto 0 0;background:var(--muted);z-index:0}
.popt span{position:relative;z-index:1}
.popt.sel{font-weight:600}
.popt.sel .bar{background:#DADAD5}
.status{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.25}

/* Karte */
.map{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
[hidden]{display:none!important}
.leaflet-container{background:#ECECE8;font-family:var(--body)}
.mk{border:2.5px solid #111111;background:#111111;box-shadow:0 0 0 2px #FFFFFF}
.mk-immo{background:#FFFFFF}
.mk-punkt{background:#FFFFFF;border-radius:50%}
.mk-event{border-radius:50%}
.mk-neu{background:#FFFFFF;border-radius:50%;border-style:dashed}
.mapnote{padding:10px 12px;border-top:1px solid var(--line);color:var(--ink-2)}
.pin{cursor:pointer}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}

/* Kalender */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line)}
.cal div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:76px;padding:6px;font-size:12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .dh{min-height:0;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;color:var(--ink-2);background:var(--muted)}
.cal .off{color:var(--ink-3);background:#FBFBFA}
.cal .ev{background:var(--ink);color:#FFFFFF;border-radius:3px;padding:1px 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;font-size:11px}
.cal .today{font-weight:700;text-decoration:underline}

/* Dokumente */
.crumbs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:14px}
.crumbs button{border:0;background:none;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.ftype{width:34px;height:40px;border:1px solid var(--ink);border-radius:3px;display:grid;place-items:center;font-family:var(--mono);font-size:9.5px;font-weight:500;flex:none;position:relative}
.ftype.dir{border-radius:3px 3px 3px 3px;background:var(--muted)}

/* Matrix */
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(17,17,17,.45);z-index:70;display:flex;align-items:flex-end;justify-content:center;padding:env(safe-area-inset-top,0px) 0 0}
.modal{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:10px 10px 0 0;border:1px solid var(--ink);display:flex;flex-direction:column}
.modal .mh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.modal .mb{padding:16px;display:flex;flex-direction:column;gap:14px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media(min-width:760px){.ov{align-items:center}.modal{border-radius:10px}}
.x{border:0;background:none;cursor:pointer;padding:6px;font-size:20px;line-height:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#FFFFFF;padding:10px 16px;border-radius:var(--r);z-index:80;font-weight:500;max-width:calc(100% - 32px)}

/* Login */
.login{min-height:calc(100% - 30px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.login .l{padding:48px max(24px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;justify-content:space-between;gap:32px;border-right:1px solid var(--ink);background:var(--surface)}
.login .r{display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login .box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.sub{font-family:var(--mono);font-size:13px;border:1px solid var(--ink);display:inline-block;align-self:flex-start;padding:4px 8px;border-radius:4px}
.big{font-family:var(--display);font-size:44px;font-weight:800;line-height:1.02;letter-spacing:-.02em}
.big .o{color:transparent;-webkit-text-stroke:1.4px var(--ink)}

/* Mobile */
.tabbar{display:none}
.mob-top{display:none}
@media(max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mob-top{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:sticky;top:calc(env(safe-area-inset-top,0px) + 30px);z-index:40}
  .mob-top img{width:92px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--ink);z-index:45;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font-size:10.5px;text-decoration:none;color:var(--ink-2);border:0;background:none;cursor:pointer;min-height:54px;justify-content:center}
  .tabbar .on{color:var(--ink);font-weight:600}
  .tabbar .plus .ico{width:30px;height:30px;background:var(--ink);color:#FFFFFF;border-radius:50%;padding:6px}
  .dash,.grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .login{grid-template-columns:minmax(0,1fr)}
  .login .l{border-right:0;border-bottom:1px solid var(--ink);padding-block:28px}
  .big{font-size:34px}
}
@media(max-width:560px){.form{grid-template-columns:minmax(0,1fr)} h1{font-size:24px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.menu-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.menu-grid a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border:1px solid var(--line);border-radius:var(--r);text-decoration:none;font-size:13px;text-align:center}
</style>

}

/* ---------- Login ---------- */
let loginStep='login', loginMail='';
const maskMail = m => { const [a,d]=String(m).split('@'); return (a||'').slice(0,1)+'•••@'+(d||''); };
function viewLogin(){
  const steps={
   login:`<div class="stack"><span class="lbl">Anmelden</span><h1>Willkommen</h1><p class="muted">Ein Login für alle urbown-Netzwerke. Sie landen automatisch in Ihrem Netzwerk.</p></div>
     <form id="lf" class="stack">
      <div class="field"><label for="lmail">E-Mail</label><input class="in" id="lmail" type="email" required value="${esc(loginMail||'julia.brandt@beispiel.de')}" autocomplete="username"></div>
      <button class="btn" type="submit">Weiter</button>
     </form>
     <div class="card pad small" style="border-style:dashed"><b>Prototyp zum Testen:</b><br>julia.brandt@beispiel.de = Konto aus dem bisherigen urbown (erster Login)<br>anna.becker@beispiel.de = bestehendes neues Konto</div>
     <p class="small muted">Zugang nur auf Einladung. Noch kein Konto? Ein Mitglied oder das Innenstadtbüro kann Sie einladen.</p>`,
   pw:`<div class="stack"><span class="lbl">Anmelden</span><h1>Passwort eingeben</h1><p class="muted mono">${esc(loginMail)}</p></div>
     <form id="pwf" class="stack">
      <div class="field"><label for="lpw">Passwort</label><input class="in" id="lpw" type="password" required value="beispiel" autocomplete="current-password"></div>
      <label class="row small"><input type="checkbox" id="lkeep" checked> Angemeldet bleiben</label>
      <button class="btn" type="submit">Anmelden</button>
      <div class="row small"><button type="button" class="btn link" id="lforgot">Passwort vergessen</button><button type="button" class="btn link" id="lback">Andere E-Mail</button></div>
     </form>`,
   code:`<div class="stack"><span class="lbl">Erster Login im neuen urbown</span><h1>Bitte prüfen Sie Ihre E-Mails</h1>
      <p class="muted">Willkommen im neuen urbown. Ihr Konto wurde aus der bisherigen Plattform übernommen. Damit nur Sie es übernehmen können, haben wir Ihnen soeben <b>eine E-Mail an ${esc(maskMail(loginMail))}</b> geschickt. Sie enthält einen <b>6-stelligen Code</b>, gültig 15 Minuten.</p></div>
     <form id="cf6" class="stack">
      <div class="field"><label for="code6">Code aus der E-Mail</label><input class="in mono" id="code6" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456" style="font-size:22px;letter-spacing:.3em" required></div>
      <p class="small" id="c6err" role="alert"></p>
      <button class="btn" type="submit">Code bestätigen</button>
      <div class="row small"><button type="button" class="btn link" id="c6again">E-Mail erneut senden</button><button type="button" class="btn link" id="lback">Andere E-Mail</button></div>
     </form>
     <p class="small muted">Keine E-Mail erhalten? Bitte prüfen Sie auch den Spam-Ordner. Absender: urbown.com.<br>Prototyp: beliebige 6 Ziffern eingeben.</p>`,
   first:`<div class="stack"><span class="lbl">Code bestätigt</span><h1>Neues Passwort festlegen</h1><p class="muted">Vergeben Sie einmalig ein neues Passwort. Ab dann melden Sie sich mit E-Mail und diesem Passwort an.</p></div>
     <form id="pf" class="stack">
      <div class="field"><label for="np1">Neues Passwort</label><input class="in" id="np1" type="password" minlength="10" required placeholder="mindestens 10 Zeichen"></div>
      <div class="field"><label for="np2">Passwort wiederholen</label><input class="in" id="np2" type="password" required></div>
      <p class="small" id="pferr" role="alert"></p>
      <button class="btn" type="submit">Passwort speichern</button></form>`,
   twofa:`<div class="stack"><span class="lbl">Optional</span><h1>Mehr Sicherheit mit 2FA</h1><p class="muted">Mit einer Authenticator-App erhalten Sie beim Login zusätzlich einen 6-stelligen Code. Sie können das jederzeit in Ihrem Portfolio ändern.</p></div>
     <div class="row"><button class="btn" id="tfOn">2FA einrichten</button><button class="btn ghost" id="tfLater">Später</button></div>`,
   choose:`<div class="stack"><span class="lbl">Angemeldet</span><h1>Welches Netzwerk?</h1><p class="muted">Sie sind Mitglied in mehreren Netzwerken. Wechseln können Sie jederzeit oben links.</p></div>
     <div class="stack">${S.myNets.map(sub=>{const n=S.networks.find(x=>x.sub===sub)||{n:sub}; return `<button class="btn ${sub===CITY.sub?'':'ghost'}" data-pick="${sub}" style="justify-content:space-between"><span>${esc(n.n)}</span><span class="mono" style="font-size:12px">app.urbown.com/${sub}</span></button>`;}).join('')}</div>`,
   forgot:`<div class="stack"><span class="lbl">Passwort vergessen</span><h1>Code anfordern</h1><p class="muted">Sie erhalten eine E-Mail mit einem 6-stelligen Code, mit dem Sie ein neues Passwort festlegen.</p></div>
     <form id="ff" class="stack"><div class="field"><label for="fmail">E-Mail</label><input class="in" id="fmail" type="email" required value="${esc(loginMail)}"></div><button class="btn" type="submit">E-Mail senden</button><button type="button" class="btn link" id="fback">Zurück zum Login</button></form>`
  };

   <p class="mono muted">Ein Login für alle Netzwerke · Kurzadresse ${CITY.sub}.urbown.com</p></div>
   <div class="r"><div class="box">${steps[loginStep]}</div></div></div>`;

function finishLogin(){ if(S.myNets.length>1){loginStep='choose';render();return;} S.logged=true; loginStep='login'; save(); go('start'); render(); }
function bindLogin(){
  const q=s=>document.querySelector(s);
  q('#lf')&&(q('#lf').onsubmit=e=>{e.preventDefault(); loginMail=q('#lmail').value.trim().toLowerCase(); if(!loginMail){return;}
    loginStep=(S.migrated||[]).includes(loginMail)?'code':'pw'; render(); if(loginStep==='code') toast('E-Mail mit Code gesendet'); });
  q('#pwf')&&(q('#pwf').onsubmit=e=>{e.preventDefault(); finishLogin();});
  q('#cf6')&&(q('#cf6').onsubmit=e=>{e.preventDefault(); if(!/^\d{6}$/.test(q('#code6').value.trim())){q('#c6err').textContent='Bitte die 6 Ziffern aus der E-Mail eingeben.';return;} loginStep='first'; render();});
  q('#c6again')&&(q('#c6again').onclick=()=>toast('Neue E-Mail mit Code gesendet'));
  document.querySelectorAll('#lback').forEach(b=>b.onclick=()=>{loginStep='login';render();});
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{ if(b.dataset.pick!==CITY.sub){toast('Im Prototyp ist nur '+CITY.name+' befüllt');return;} S.logged=true; loginStep='login'; save(); go('start'); render(); });
  q('#lforgot')&&(q('#lforgot').onclick=()=>{loginStep='forgot';render();});
  q('#fback')&&(q('#fback').onclick=()=>{loginStep='login';render();});
  q('#ff')&&(q('#ff').onsubmit=e=>{e.preventDefault(); loginMail=q('#fmail').value.trim().toLowerCase(); toast('Falls die Adresse registriert ist, erhalten Sie eine E-Mail mit Code.'); loginStep='code'; render();});
  q('#pf')&&(q('#pf').onsubmit=e=>{e.preventDefault(); if(q('#np1').value.length<10){q('#pferr').textContent='Bitte mindestens 10 Zeichen verwenden.';return;} if(q('#np1').value!==q('#np2').value){q('#pferr').textContent='Die Passwörter stimmen nicht überein.';return;} S.migrated=(S.migrated||[]).filter(m=>m!==loginMail); save(); loginStep='twofa'; render();});
  q('#tfOn')&&(q('#tfOn').onclick=()=>{S.twofa=true;save();toast('2FA aktiviert');finishLogin();});
  q('#tfLater')&&(q('#tfLater').onclick=()=>finishLogin());
}

/* ---------- Dashboard ---------- */
let ctype='post', feedFilter='alle', feedScope='netz';
function setCType(t){ ctype=t; render(); const ta=document.getElementById('cText'); ta&&ta.focus(); }
function feedAll(){
  const items=[
    ...S.feed.map(p=>({k:p.type,at:p.at,p})),
    ...S.flaechen.map(f=>({k:'flaeche',at:f.at,p:f})),
    ...S.immos.map(f=>({k:'immo',at:f.at,p:f})),
    ...S.topics.map(t=>({k:'thema',at:t.replies.length?t.replies[t.replies.length-1].at:t.at,p:t})),
    ...S.news.map(n=>({k:'news',at:n.at,p:n})),
    ...S.events.map(e=>({k:'event',at:e.created||hrs(36),p:e})),
    ...S.docs.filter(d=>!d.dir&&d.at).map(d=>({k:'doc',at:d.at,p:d})),
    ...S.points.map(m=>({k:'punkt',at:m.at||hrs(140),p:m}))
  ].sort((a,b)=>new Date(b.at)-new Date(a.at));
  return items;
}
const FF={alle:'Alles',beitraege:'Beiträge',flaeche:'Flächen',immo:'Immobilien',news:'City News',thema:'Forum',event:'Events'};
function scopeMatch(it){ const p=it.p; return feedScope==='netz' ? !p.net : (p.vis==='alle'); }
function feedMatch(k){ if(feedFilter==='alle')return true; if(feedFilter==='beitraege')return ['post','bild','video','status','umfrage'].includes(k); return k===feedFilter; }
function renderPoll(p){
  const total=p.opts.reduce((s,o)=>s+o.v.length,0)||1;
  return `<div class="poll">${p.opts.map((o,i)=>{const pc=Math.round(o.v.length/total*100); const sel=o.v.includes(S.me);
    return `<button class="popt ${sel?'sel':''}" data-vote="${p.id}:${i}"><span class="bar" style="width:${pc}%"></span><span>${sel?'✓ ':''}${esc(o.t)}</span><span class="num">${pc} %</span></button>`}).join('')}
    <div class="small muted">${p.opts.reduce((s,o)=>s+o.v.length,0)} Stimmen · ${p.multi?'Mehrfachauswahl':'Einfachauswahl'}${p.anon?' · anonym':''} · endet ${fmtD(p.end)}</div></div>`;
}
function feedItem(it){
  const p=it.p, nw=isNew(it.at)?'<span class="new" title="Neu seit Ihrem letzten Besuch"></span>':'';
  const head=(by,label)=>`<div class="feed-meta">${who(by,`${esc(label)}${p.net?' · Netzwerk '+esc(p.net):''} · ${ago(it.at)}`)}<span style="margin-left:auto" class="row">${visBadge(p)}${nw}</span></div>`;
  const social=`<div class="row small"><button class="btn link" data-like="${p.id}">Gefällt mir${p.likes&&p.likes.length?` · ${p.likes.length}`:''}</button><button class="btn link" data-com="${p.id}">Kommentieren${p.com&&p.com.length?` · ${p.com.length}`:''}</button></div>
   ${p.com&&p.com.length?`<div class="stack" style="gap:8px;border-left:2px solid var(--line);padding-left:12px">${p.com.map(c=>`<div class="small"><b>${esc(U(c.by).n)}</b> ${esc(c.t)}</div>`).join('')}</div>`:''}`;
  switch(it.k){
    case 'post': return `<div class="feed-item">${head(p.by,'Post')}<p>${esc(p.text)}</p>${social}</div>`;
    case 'status': return `<div class="feed-item">${head(p.by,'Status')}<p class="status">${esc(p.text)}</p>${social}</div>`;
    case 'bild': return `<div class="feed-item">${head(p.by,'Bild')}<p>${esc(p.text)}</p><div class="thumb">${p.img?`<img src="${p.img}" alt="">`:'Bild'}</div>${social}</div>`;
    case 'video': return `<div class="feed-item">${head(p.by,'Video')}<p>${esc(p.text)}</p><a class="btn ghost sm" href="${esc(p.url)}" target="_blank" rel="noopener">${I('video')}Video ansehen</a>${social}</div>`;
    case 'umfrage': return `<div class="feed-item">${head(p.by,'Umfrage')}<h3>${esc(p.text)}</h3>${renderPoll(p)}${social}</div>`;
    case 'flaeche': return `<div class="feed-item clickable" data-open="f:${p.id}">${head(p.by,'Neue vakante Fläche')}<div class="row"><span class="badge">${esc(p.use)}</span><span class="mono">${p.m2} m² · Front ${p.front} m · ab ${fmtD(p.ab)}</span></div><h3>${esc(p.t)} · ${esc(p.q)}</h3></div>`;
    case 'immo': return `<div class="feed-item clickable" data-open="i:${p.id}">${head(p.by,'Neues Immobilien-Inserat')}<div class="row"><span class="badge">${esc(p.art)}</span><span class="mono">${p.flaeche} m² · ${chf(p.preis)}</span></div><h3>${esc(p.t)}</h3></div>`;
    case 'thema': return `<div class="feed-item clickable" data-open="t:${p.id}">${head(p.replies.length?p.replies[p.replies.length-1].by:p.by, p.replies.length?'Antwort im Forum':'Neues Forenthema')}<h3>${esc(p.t)}</h3><span class="small muted">${esc(p.cat)} · ${p.replies.length} Antworten</span></div>`;
    case 'news': return `<div class="feed-item clickable" data-open="n:${p.id}">${head(p.by,'City News')}<h3>${esc(p.t)}</h3><p class="small muted">Quelle: ${esc(p.src)} · ${fmtD(p.srcDate)}</p></div>`;
    case 'event': return `<div class="feed-item clickable" data-open="e:${p.id}">${head(p.by,'Event')}<h3>${esc(p.t)}</h3><span class="mono">${fmtDT(p.d)} · ${esc(p.ort)}</span></div>`;
    case 'doc': return `<div class="feed-item">${head(p.by,'Dokument hochgeladen')}<div class="row"><span class="ftype">${p.ext}</span><span>${esc(p.n)}</span></div></div>`;
    case 'punkt': return `<div class="feed-item clickable" data-go="karte">${head(p.by,'Neuer Kartenpunkt')}<h3>${esc(p.t)} · ${esc(p.q)}</h3><span class="small muted">${esc(p.theme)}</span></div>`;
  }
  return '';
}
function viewStart(){
  const fl=S.flaechen.filter(f=>f.status!=='vermietet').slice(0,3), im=S.immos.slice(0,2);

/* ---------- Karte (OpenStreetMap über Leaflet) ---------- */
const WEST='ABCDEFGHK', EAST='LMNOPQRSTU';
/* Näherung der Mannheimer Quadrate: Buchstaben entlang der Breiten Strasse, Zahlen nach aussen. Live: Adresssuche (Geocoding). */
function qLL(q){ const m=String(q||'').toUpperCase().match(/^([A-U])\s?(\d)/); if(!m) return null;
  let i=EAST.indexOf(m[1]), side=1; if(i<0){ i=WEST.indexOf(m[1]); side=-1; } if(i<0) return null; const n=+m[2];
  return [49.4843+i*0.00084+side*(n-0.5)*(-0.00041), 8.4650+i*0.00036+side*(n-0.5)*0.00127]; }
const llOf = o => (o && o.ll) || qLL(o && o.q);
const MAPS=[];
function mapSvg(markers, h=460){ const id='map'+MAPS.length+'_'+Date.now(); MAPS.push({id,markers});
  return `<div id="${id}" style="height:${h}px;max-width:100%" role="region" aria-label="Karte"></div><p class="mapnote small" id="${id}-n" hidden>Die Kartenkacheln von OpenStreetMap werden in der Vorschau von claude.ai blockiert. Die Markierungen sind richtig platziert; die Strassenkarte erscheint, wenn Sie die Datei direkt im Browser öffnen, und in der Live-Version.</p>`; }
function baseMap(el, opts={}){
  const map=L.map(el,Object.assign({scrollWheelZoom:false},opts)).setView([49.4875,8.4665],15);
  let failed=false; const note=document.getElementById(el.id+'-n');
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap-Mitwirkende'}).on('tileerror',()=>{ if(!failed&&note){failed=true;note.hidden=false;} }).addTo(map);
  return map;
}
function initMaps(){
  MAPS.splice(0).forEach(({id,markers})=>{ const el=document.getElementById(id); if(!el) return;
    if(!window.L){ const n=document.getElementById(id+'-n'); n&&(n.hidden=false); return; }
    const map=baseMap(el); const pts=[];
    markers.forEach(m=>{ if(!m.ll) return; pts.push(m.ll);
      const mk=L.marker(m.ll,{icon:L.divIcon({className:'mk mk-'+m.kind,iconSize:[18,18],iconAnchor:[9,9]}),title:m.t,keyboard:true}).addTo(map);
      mk.bindTooltip(esc(m.t)); mk.on('click',()=>{ const [k,rid]=m.ref.split(':'); ({f:showFlaeche,i:showImmo,e:showEvent,m:showPoint})[k](rid); }); });
    if(pts.length>1) map.fitBounds(pts,{padding:[40,40],maxZoom:16}); else if(pts.length) map.setView(pts[0],16);
    setTimeout(()=>map.invalidateSize(),60);
  });
}
let mapFilter={punkt:true,flaeche:true,immo:true,event:true};
function allMarkers(){
  const m=[];
  if(mapFilter.punkt) S.points.forEach(p=>m.push({kind:'punkt',ll:llOf(p),t:p.t,ref:'m:'+p.id}));
  if(mapFilter.flaeche) S.flaechen.forEach(p=>m.push({kind:'flaeche',ll:llOf(p),t:p.t,ref:'f:'+p.id}));
  if(mapFilter.immo) S.immos.forEach(p=>m.push({kind:'immo',ll:llOf(p),t:p.t,ref:'i:'+p.id}));
  if(mapFilter.event) S.events.forEach(e=>{const q=(e.ort.match(/[A-U]\d/)||[])[0]; const ll=e.ll||qLL(q); if(ll) m.push({kind:'event',ll,t:e.t,ref:'e:'+e.id});});
  return m;
}

   m.querySelector('#pf2').onsubmit=e=>{e.preventDefault(); const q=m.querySelector('#pq').value.toUpperCase(); if(!ll&&!qLL(q)){toast('Bitte Ort auf der Karte antippen oder ein Quadrat eingeben');return;} S.points.unshift({id:uid(),by:S.me,t:m.querySelector('#pt').value,q:q||'Karte',ll,theme:m.querySelector('#pth').value,desc:m.querySelector('#pd').value,at:new Date().toISOString()}); save(); closeModal(); render(); toast('Ort eingetragen');};});

/* ---------- Events ---------- */
let evView='kalender', calOff=0;
function viewEvents(){
  const base=new Date(); base.setDate(1); base.setMonth(base.getMonth()+calOff);
  const y=base.getFullYear(), mo=base.getMonth(); const first=(new Date(y,mo,1).getDay()+6)%7; const days=new Date(y,mo+1,0).getDate();
  let cells=['Mo','Di','Mi','Do','Fr','Sa','So'].map(d=>`<div class="dh">${d}</div>`).join('');
  for(let i=0;i<first;i++) cells+='<div class="off"></div>';
  const today=new Date();
  for(let d=1;d<=days;d++){ const evs=S.events.filter(e=>{const x=new Date(e.d);return x.getFullYear()===y&&x.getMonth()===mo&&x.getDate()===d;});
    const isT=today.getFullYear()===y&&today.getMonth()===mo&&today.getDate()===d;
    cells+=`<div><span class="${isT?'today':''}">${d}</span>${evs.map(e=>`<span class="ev" data-open="e:${e.id}">${esc(e.t)}</span>`).join('')}</div>`; }
  const sorted=[...S.events].sort((a,b)=>new Date(a.d)-new Date(b.d));
  return `<div class="head"><div class="t"><span class="lbl">Termine</span><h1>Events</h1></div><button class="btn" id="addE">${I('plus')}Event erstellen</button></div>
  <div class="row" style="justify-content:space-between"><div class="row"><button class="btn ghost sm" id="cPrev" aria-label="Vorheriger Monat">‹</button><b>${base.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</b><button class="btn ghost sm" id="cNext" aria-label="Nächster Monat">›</button></div>
  <div class="seg"><button class="${evView==='kalender'?'on':''}" data-ev="kalender">Kalender</button><button class="${evView==='liste'?'on':''}" data-ev="liste">Liste</button></div></div>
  ${evView==='kalender'?`<div class="card tbl"><div class="cal" style="min-width:560px">${cells}</div></div>`:
  `<div class="card list">${sorted.map(e=>`<div class="item clickable" data-open="e:${e.id}"><div class="stack" style="gap:0;align-items:center;min-width:48px"><b style="font-family:var(--display);font-size:22px">${new Date(e.d).getDate()}</b><span class="lbl">${new Date(e.d).toLocaleDateString('de-DE',{month:'short'})}</span></div><div class="body"><b>${esc(e.t)}</b><span class="small muted">${fmtDT(e.d)} · ${esc(e.ort)}</span></div>${e.att.includes(S.me)?'<span class="badge solid">dabei</span>':''}</div>`).join('')}</div>`}`;
}
function bindEvents(){
  document.getElementById('addE').onclick=()=>editEvent();
  document.getElementById('cPrev').onclick=()=>{calOff--;render();}; document.getElementById('cNext').onclick=()=>{calOff++;render();};
  document.querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>{evView=b.dataset.ev;render();});
}

  modal(e.t,`<dl class="kv"><dt>Wann</dt><dd>${fmtDT(e.d)} Uhr</dd><dt>Wo</dt><dd>${esc(e.ort)}</dd><dt>Teilnehmer</dt><dd>${e.att.length}</dd></dl><p>${esc(e.desc)}</p>${who(e.by,'Veranstalter')}
  ${e.att.length?`<div class="small muted">${e.att.map(a=>esc(U(a).n)).join(', ')}</div>`:''}

  ${e.by===S.me||isAdmin()?`<button class="btn ghost" id="eEd">Bearbeiten</button><button class="btn ghost" id="eDel">Löschen</button>`:''}</div>`, m=>{
    m.querySelector('#eGo')&&(m.querySelector('#eGo').onclick=()=>{e.att=going?e.att.filter(x=>x!==S.me):[...e.att,S.me];save();render();showEvent(id);});
    m.querySelector('#eIcs').onclick=()=>toast('Live-Version: Kalenderdatei (.ics) für Outlook, Google und Apple');
    m.querySelector('#eEd')&&(m.querySelector('#eEd').onclick=()=>editEvent(e));
    m.querySelector('#eDel')&&(m.querySelector('#eDel').onclick=()=>confirmBox('Event löschen?',()=>{S.events=S.events.filter(x=>x.id!==id);save();render();}));
  });
}
function editEvent(e){
  const v=e||{t:'',d:inDays(7,19),ort:'',desc:'',reg:true};
  const dl=new Date(v.d); const loc=new Date(dl.getTime()-dl.getTimezoneOffset()*60000).toISOString().slice(0,16);
  modal(e?'Event bearbeiten':'Event erstellen',`<form id="ef" class="form"><div class="field full"><label for="e1">Titel</label><input class="in" id="e1" required value="${esc(v.t)}"></div>
   <div class="field"><label for="e2">Datum und Uhrzeit</label><input class="in" id="e2" type="datetime-local" required value="${loc}"></div>
   <div class="field"><label for="e3">Ort</label><input class="in" id="e3" required value="${esc(v.ort)}" placeholder="z. B. Café Quadrat, N2, 3"></div>
   <div class="field full"><label for="e4">Beschreibung</label><textarea class="in" id="e4">${esc(v.desc)}</textarea></div>
   ${visField('eV',v.vis)}
   <label class="row full small"><input type="checkbox" id="e5" ${v.reg?'checked':''}> Anmeldung möglich</label>
   <div class="full"><button class="btn" type="submit">Speichern</button></div></form>`, m=>{
    m.querySelector('#ef').onsubmit=ev=>{ev.preventDefault(); const g=id=>m.querySelector('#'+id); const o={vis:g('eV').value,t:g('e1').value,d:new Date(g('e2').value).toISOString(),ort:g('e3').value,desc:g('e4').value,reg:g('e5').checked};
      if(e) Object.assign(e,o); else S.events.push({id:uid(),by:S.me,att:[],created:new Date().toISOString(),...o}); save(); closeModal(); render(); toast('Event gespeichert');};
  });
}

/* ---------- Dokumente ---------- */
let docDir='d0';
function pathTo(id){ const p=[]; let c=S.docs.find(d=>d.id===id); while(c){p.unshift(c); c=S.docs.find(d=>d.id===c.parent);} return p; }
function viewDocs(){
  const items=S.docs.filter(d=>d.parent===docDir).sort((a,b)=>(b.dir-a.dir)||a.n.localeCompare(b.n));
  return `<div class="head"><div class="t"><span class="lbl">Ablage</span><h1>Dokumente</h1></div><div class="row"><button class="btn ghost" id="newDir">${I('folder')}Neuer Ordner</button><label class="btn" for="upl">${I('plus')}Hochladen</label><input type="file" id="upl" multiple hidden></div></div>
  <div class="row" style="justify-content:space-between"><nav class="crumbs" aria-label="Pfad">${pathTo(docDir).map((p,i,a)=>i<a.length-1?`<button data-dir="${p.id}">${esc(p.n)}</button><span class="muted">/</span>`:`<b>${esc(p.n)}</b>`).join('')}</nav>
  <input class="in" id="dSearch" placeholder="Dokumente durchsuchen" style="max-width:260px" aria-label="Dokumente durchsuchen"></div>
  <div class="card list" id="dList">${items.map(d=>docRow(d)).join('')||'<div class="empty">Dieser Ordner ist leer. Laden Sie die erste Datei hoch.</div>'}</div>`;
}
function docRow(d){
  return `<div class="item ${d.dir?'clickable':''}" ${d.dir?`data-dir="${d.id}"`:''}><span class="ftype ${d.dir?'dir':''}">${d.dir?'':esc(d.ext)}</span>
   <div class="body"><b>${esc(d.n)}</b><span class="small muted">${d.dir?S.docs.filter(x=>x.parent===d.id).length+' Einträge':`${esc(d.size)} · ${esc(U(d.by).n)} · ${fmtD(d.at)}`}</span></div>
   <div class="row" style="gap:2px"><button class="btn link small" data-ren="${d.id}">Umbenennen</button><button class="btn link small" data-del="${d.id}">Löschen</button></div></div>`;
}
function bindDocs(){
  document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=e=>{ if(e.target.closest('[data-ren],[data-del]'))return; docDir=b.dataset.dir; render();});
  document.getElementById('newDir').onclick=()=>modal('Neuer Ordner',`<div class="field"><label for="dn">Name</label><input class="in" id="dn"></div><button class="btn" id="dnOk">Anlegen</button>`,m=>{m.querySelector('#dnOk').onclick=()=>{const n=m.querySelector('#dn').value.trim(); if(!n)return; S.docs.push({id:uid(),parent:docDir,dir:true,n}); save(); closeModal(); render();};});
  document.getElementById('upl').onchange=e=>{[...e.target.files].forEach(f=>{const ext=(f.name.split('.').pop()||'').slice(0,4).toUpperCase(); S.docs.push({id:uid(),parent:docDir,dir:false,n:f.name,ext,size:Math.max(1,Math.round(f.size/1024))+' KB',by:S.me,at:new Date().toISOString()});}); save(); render(); toast('Hochgeladen');};
  document.querySelectorAll('[data-ren]').forEach(b=>b.onclick=e=>{e.stopPropagation(); const d=S.docs.find(x=>x.id===b.dataset.ren); modal('Umbenennen',`<div class="field"><label for="rn">Neuer Name</label><input class="in" id="rn" value="${esc(d.n)}"></div><button class="btn" id="rnOk">Speichern</button>`,m=>{m.querySelector('#rnOk').onclick=()=>{d.n=m.querySelector('#rn').value.trim()||d.n; save(); closeModal(); render();};});});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{e.stopPropagation(); const id=b.dataset.del; confirmBox('Eintrag löschen? Ordner werden mit Inhalt gelöscht.',()=>{const kill=x=>{S.docs.filter(d=>d.parent===x).forEach(d=>kill(d.id)); S.docs=S.docs.filter(d=>d.id!==x);}; kill(id); save(); render();});});
  document.getElementById('dSearch').oninput=e=>{const q=e.target.value.toLowerCase(); const L=document.getElementById('dList'); if(!q){render();return;} const r=S.docs.filter(d=>!d.dir&&d.n.toLowerCase().includes(q)); L.innerHTML=r.map(docRow).join('')||'<div class="empty">Keine Treffer.</div>';};
}

/* ---------- Gruppen ---------- */
let grp=null, grpTab='beitraege';
function viewGroups(){
  if(grp){ const g=S.groups.find(x=>x.id===grp); const member=g.mem.includes(S.me);
    const tabs={beitraege:'Beiträge',themen:'Themen',dokumente:'Dokumente',mitglieder:'Mitglieder'};
    const body={beitraege:`${member?`<div class="card pad stack"><textarea class="in" id="gp" placeholder="Beitrag in der Gruppe"></textarea><div class="row" style="justify-content:flex-end"><button class="btn sm" id="gpOk">Posten</button></div></div>`:''}<div class="card list">${g.posts.map(p=>`<div class="feed-item">${who(p.by,ago(p.at))}<p>${esc(p.t)}</p></div>`).join('')||'<div class="empty">Noch keine Beiträge.</div>'}</div>`,
      themen:`<div class="card list">${g.topics.map(t=>`<div class="item"><div class="body"><b>${esc(t.t)}</b><span class="small muted">${esc(U(t.by).n)} · ${ago(t.at)}</span></div></div>`).join('')||'<div class="empty">Noch keine Themen.</div>'}</div>${member?`<div class="row"><input class="in" id="gt" placeholder="Neues Thema" style="flex:1"><button class="btn" id="gtOk">Eröffnen</button></div>`:''}`,
      dokumente:`<div class="card list">${g.docs.map(d=>`<div class="item"><span class="ftype">${esc(d.split('.').pop().toUpperCase())}</span><div class="body"><b>${esc(d)}</b></div></div>`).join('')||'<div class="empty">Noch keine Dokumente.</div>'}</div>`,
      mitglieder:`<div class="card list">${g.mem.map(m=>`<div class="item">${who(m,esc(U(m).firm))}</div>`).join('')}</div>`}[grpTab];
    return `<div><button class="btn link" id="gBack">‹ Alle Gruppen</button></div><div class="head"><div class="t"><span class="lbl">${g.open?'Offene Gruppe':'Geschlossene Gruppe'} · ${g.mem.length} Mitglieder</span><h1>${esc(g.n)}</h1><p class="muted">${esc(g.desc)}</p></div><button class="btn ${member?'ghost':''}" id="gJoin">${member?'Gruppe verlassen':(g.open?'Beitreten':'Beitritt anfragen')}</button></div>
     <div class="tabs">${Object.entries(tabs).map(([k,l])=>`<button class="${grpTab===k?'on':''}" data-gt="${k}">${l}</button>`).join('')}</div>${body}`;
  }
  return `<div class="head"><div class="t"><span class="lbl">Zusammenarbeit</span><h1>Gruppen</h1><p class="muted">Arbeitsgruppen und Nachbarschaften mit eigenen Themen, Beiträgen und Dokumenten.</p></div><button class="btn" id="addG">${I('plus')}Gruppe gründen</button></div>
  <div class="grid3">${S.groups.map(g=>`<article class="card pad stack clickable" data-g="${g.id}" style="gap:8px"><span class="lbl">${g.open?'offen':'geschlossen'} · ${g.mem.length} Mitglieder</span><h3>${esc(g.n)}</h3><p class="small muted">${esc(g.desc)}</p>${g.mem.includes(S.me)?'<span class="badge solid" style="align-self:flex-start">Mitglied</span>':''}</article>`).join('')}</div>`;
}
function bindGroups(){
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{grp=b.dataset.g;grpTab='beitraege';render();});
  const q=s=>document.querySelector(s);
  q('#gBack')&&(q('#gBack').onclick=()=>{grp=null;render();});
  document.querySelectorAll('[data-gt]').forEach(b=>b.onclick=()=>{grpTab=b.dataset.gt;render();});
  if(grp){ const g=S.groups.find(x=>x.id===grp);
    q('#gJoin').onclick=()=>{ if(g.mem.includes(S.me)) g.mem=g.mem.filter(x=>x!==S.me); else if(g.open) g.mem.push(S.me); else {toast('Anfrage an die Gruppenleitung gesendet');return;} save(); render(); };
    q('#gpOk')&&(q('#gpOk').onclick=()=>{const v=q('#gp').value.trim(); if(!v)return; g.posts.unshift({by:S.me,t:v,at:new Date().toISOString()}); save(); render();});
    q('#gtOk')&&(q('#gtOk').onclick=()=>{const v=q('#gt').value.trim(); if(!v)return; g.topics.unshift({by:S.me,t:v,at:new Date().toISOString()}); save(); render();});
  }
  q('#addG')&&(q('#addG').onclick=()=>modal('Gruppe gründen',`<form id="gf" class="stack"><div class="field"><label for="gn">Name</label><input class="in" id="gn" required></div><div class="field"><label for="gd">Beschreibung</label><textarea class="in" id="gd"></textarea></div><label class="row small"><input type="checkbox" id="go" checked> Offene Gruppe (jedes Mitglied kann beitreten)</label><button class="btn" type="submit">Gründen</button></form>`,m=>{m.querySelector('#gf').onsubmit=e=>{e.preventDefault(); S.groups.unshift({id:uid(),n:m.querySelector('#gn').value,desc:m.querySelector('#gd').value,open:m.querySelector('#go').checked,mem:[S.me],posts:[],topics:[],docs:[]}); save(); closeModal(); render();};}));
}

let pfTab='inhalte';
function myItems(){
  const r=[];
  S.feed.filter(x=>x.by===S.me).forEach(x=>r.push({k:x.type,t:x.text,at:x.at,id:x.id,vis:x.vis,col:'feed'}));
  S.flaechen.filter(x=>x.by===S.me).forEach(x=>r.push({k:'flaeche',t:x.t,at:x.at,id:x.id,vis:x.vis,col:'flaechen',st:x.status}));
  S.immos.filter(x=>x.by===S.me).forEach(x=>r.push({k:'immo',t:x.t,at:x.at,id:x.id,vis:x.vis,col:'immos',st:x.status}));
  S.topics.filter(x=>x.by===S.me).forEach(x=>r.push({k:'thema',t:x.t,at:x.at,id:x.id,vis:x.vis,col:'topics'}));
  S.news.filter(x=>x.by===S.me).forEach(x=>r.push({k:'news',t:x.t,at:x.at,id:x.id,vis:x.vis,col:'news'}));
  S.events.filter(x=>x.by===S.me).forEach(x=>r.push({k:'event',t:x.t,at:x.d,id:x.id,vis:x.vis,col:'events'}));
  S.points.filter(x=>x.by===S.me).forEach(x=>r.push({k:'punkt',t:x.t,at:x.at||hrs(100),id:x.id,vis:x.vis,col:'points'}));
  S.docs.filter(x=>x.by===S.me).forEach(x=>r.push({k:'doc',t:x.n,at:x.at,id:x.id,vis:x.vis,col:'docs'}));
  return r.sort((a,b)=>new Date(b.at)-new Date(a.at));
}

    nl.querySelector('#nl2').oninput=upd; nl.querySelector('#nl3').oninput=upd; nl.querySelector('#nlTest').onclick=()=>toast('Testversand an Ihre Adresse ausgelöst'); nl.onsubmit=e=>{e.preventDefault();toast('Versand geplant');}; }
}

const VIEWS={start:[viewStart,bindStart],flaechen:[viewFlaechen,bindFlaechen],immobilien:[viewImmo,bindImmo],forum:[viewForum,bindForum],news:[viewNews,bindNews],events:[viewEvents,bindEvents],dokumente:[viewDocs,bindDocs],gruppen:[viewGroups,bindGroups],karte:[viewKarte,bindKarte],mitglieder:[viewMembers,bindMembers],nachrichten:[viewMsgs,bindMsgs],portfolio:[viewPortfolio,bindPortfolio],einladen:[viewInvite,bindInvite],admin:[viewAdmin,bindAdmin],superadmin:[viewSuper,bindSuper]};
function render(){
  MAPS.length=0;
  protoBar();
  const app=document.getElementById('app');
  if(!S.logged){ app.innerHTML=viewLogin(); bindLogin(); return; }
  const r=VIEWS[route()]?route():'start';
  app.innerHTML=shell(VIEWS[r][0]());
  VIEWS[r][1](); bindFeedCommon(); bindNetSwitch(); initMaps();
  document.getElementById('tbPlus').onclick=openCreateMenu;
  document.getElementById('tbMenu').onclick=openMenu;
}
render();
