name: Gitleaks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Gitleaks direkt als Container (die gitleaks-action braucht für Organisationen eine Lizenz).
      - name: Gitleaks
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --no-banner --config /repo/.gitleaks.toml -v /repo
