name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mailpit:
        image: axllent/mailpit:v1.34.0
        ports:
          - 1125:1025
          - 8125:8025
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      NEXT_PUBLIC_APP_URL: http://app.localhost:3100
      NEXT_PUBLIC_DEMO_URL: https://demo.urbown.com
      MAIL_TRANSPORT: smtp
      SMTP_URL: smtp://127.0.0.1:1125
      MAIL_FROM: "urbown <no-reply@urbown.com>"
      MAIL_TO_CONTACT: info@urbown.com
      MAILPIT_URL: http://127.0.0.1:8125
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tests/package-lock.json
      - name: Install (web)
        run: npm ci
        working-directory: web
      - name: Lint
        run: npm run lint
        working-directory: web
      - name: Typecheck
        run: npm run typecheck
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web
      - name: Install (tests)
        run: npm ci && npx playwright install --with-deps chromium
        working-directory: tests
      - name: Playwright + axe gegen next start
        run: npm run test:e2e
        working-directory: tests
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: tests/playwright-report
          retention-days: 7
