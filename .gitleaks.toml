# Gitleaks – Standardregeln, keine Ausnahmen für docs/grundlagen/.
title = "urbown"

[extend]
useDefault = true

[allowlist]
description = "Nur öffentliche Test- und Platzhalterwerte"
# Öffentliche Cloudflare-Turnstile-Testschlüssel (dokumentiert, keine Geheimnisse)
regexes = [
  '''1x0000000000000000000000000000000AA''',
  '''1x00000000000000000000AA''',
  '''2x0000000000000000000000000000000AA''',
]
paths = [
  '''(^|/)package-lock\.json$''',
]
